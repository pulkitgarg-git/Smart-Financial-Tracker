spring.application.name=smartFinancialTracker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_financial_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
